name: Pruebas Erasmus+ MMG
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar scripts de Ubuntu
        run: |
          bash -n deploy/install-ubuntu.sh
          bash -n deploy/update-ubuntu.sh
          bash -n deploy/init-admin-ubuntu.sh
      - name: Verificar sintaxis
        run: |
          node --check src/server.mjs
          node --check src/feature-candidates.mjs
          node --check src/feature-social.mjs
          node --check src/feature-accounts.mjs
      - name: Ejecutar pruebas
        run: npm test
      - name: Ensayar instalación con permisos root restrictivos
        run: |
          sudo bash <<'SCRIPT'
          set -Eeuo pipefail
          umask 077
          stage=$(mktemp -d /tmp/mmg-release-test.XXXXXXXX)
          trap 'rm -rf -- "$stage"' EXIT
          cp -a package.json package-lock.json src scripts public tests node_modules "$stage/"
          chmod -R a+rX "$stage"
          chmod -R go-w "$stage"
          cd "$stage"
          runuser -u nobody -- env HOME=/tmp npm_config_cache=/tmp/mmg-npm-test-cache npm test
          SCRIPT
