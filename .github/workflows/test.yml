name: Pruebas Erasmus+ MMG
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxis
        run: |
          node --check src/server.mjs
          node --check src/feature-candidates.mjs
          node --check src/feature-social.mjs
          node --check src/feature-accounts.mjs
      - name: Ejecutar pruebas
        run: npm test
