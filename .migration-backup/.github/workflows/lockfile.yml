name: Mantener package-lock.json
on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - .github/workflows/lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generar lockfile reproducible
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Publicar solo el lockfile
        run: |
          if ! git diff --quiet -- package-lock.json || test -n "$(git ls-files --others --exclude-standard package-lock.json)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore: lock dependencies for reproducible Ubuntu deployments"
            git push origin HEAD:main
          fi
